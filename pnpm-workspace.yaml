# Declares this repo as a single-package pnpm workspace root.
#
# Without an explicit `packages` key, pnpm 11 on Vercel can abort the install with
# "ERROR packages field missing or empty" before the build starts — which is how
# genc-construction.com became undeployable for a week in Aug 2026, and how
# pitahouselongisland.com failed on 2026-08-15, while their domains kept serving
# stale builds. A green local install proves nothing: the local store is already
# populated.
#
# An empty list is correct: there are no sub-packages, only the root.
packages: []
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.30.0
  - tsx@4.23.11
  - '@next/env@16.3.1'
  - '@next/eslint-plugin-next@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - eslint-config-next@16.3.1
  - next@16.3.1
  - resend@6.20.0
